services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/uploads
    environment:
      - PORT=3000
      - MONGO_USER=root
      - MONGO_PASS=pass
      - MONGO_PORT=27017
      - MONGO_IP=mongo
    depends_on:
      - mongo
  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=pass
    volumes:
      - mongo-db:/data/db
  client:
    build: ./client
    ports:
      - "5173:5173"
volumes:
  mongo-db:
